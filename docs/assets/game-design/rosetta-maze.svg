<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Two spheres side by side. The left one is a dark maze whose eleven-turn route is a string of lefts and rights. The right one is an ordinary maze whose wall pattern, seen from a distance, draws that same string.">
  <title>Rosetta maze</title>
  <style>
    .paper { fill: #f6efe0; }
    .ink { fill: none; stroke: #3b3226; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .ink-thin { fill: none; stroke: #3b3226; stroke-width: 1.3; stroke-linecap: round; }
    .ink-dash { fill: none; stroke: #7a6c58; stroke-width: 1.5; stroke-dasharray: 7 6; stroke-linecap: round; }
    .wall { fill: #d8cbb0; stroke: #3b3226; stroke-width: 1.8; stroke-linejoin: round; }
    .accent { fill: none; stroke: #c9762a; stroke-width: 2.6; stroke-linecap: round; }
    .accent-fill { fill: #c9762a; }
    .pink { fill: #d1477f; stroke: #3b3226; stroke-width: 1.4; }
    .shade { fill: #3b3226; opacity: 0.13; }
    .hand { font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", "Chalkboard SE", cursive; fill: #3b3226; }
    .ttl { font-size: 20px; }
    .lbl { font-size: 14px; }
    .lbl-sm { font-size: 12.5px; fill: #7a6c58; }
  </style>

  <rect class="paper" width="760" height="420" rx="10"/>
  <text class="hand ttl" x="26" y="36">rosetta maze</text>
  <text class="hand lbl-sm" x="26" y="56">one maze's walls spell another maze's answer — legible only from far away</text>

  <!-- left: the dark biome, route unseen -->
  <circle class="ink" cx="190" cy="240" r="120"/>
  <path class="shade" d="M 190 120 A 120 120 0 1 0 190 360 A 120 120 0 1 0 190 120 Z"/>
  <path class="accent" d="M 140 300 L 140 270 L 176 270 L 176 232 L 140 232 L 140 200 L 210 200 L 210 168"/>
  <path class="accent" d="M 202 178 L 211 166 L 219 178"/>
  <text class="hand lbl" x="96" y="392">biome A: you can't see</text>
  <text class="hand lbl-sm" x="96" y="410">the route is 11 blind turns</text>

  <!-- the turn string -->
  <text class="hand lbl" x="322" y="172">L R L L R L R R L L R</text>
  <path class="ink-thin" d="M 316 178 L 288 196"/>
  <path class="ink-thin" d="M 470 178 L 500 196"/>

  <!-- right: an ordinary maze whose walls draw the string -->
  <circle class="ink" cx="570" cy="240" r="120"/>
  <g>
    <rect class="wall" x="500" y="212" width="10" height="30" rx="2"/>
    <rect class="wall" x="520" y="212" width="30" height="10" rx="2"/>
    <rect class="wall" x="560" y="212" width="10" height="30" rx="2"/>
    <rect class="wall" x="580" y="212" width="10" height="30" rx="2"/>
    <rect class="wall" x="600" y="212" width="30" height="10" rx="2"/>
    <rect class="wall" x="510" y="256" width="10" height="30" rx="2"/>
    <rect class="wall" x="532" y="256" width="30" height="10" rx="2"/>
    <rect class="wall" x="576" y="256" width="30" height="10" rx="2"/>
    <rect class="wall" x="616" y="256" width="10" height="30" rx="2"/>
  </g>
  <text class="hand lbl" x="470" y="392">biome B: an ordinary maze</text>
  <text class="hand lbl-sm" x="470" y="410">…whose walls draw A's turns</text>

  <text class="hand lbl-sm" x="292" y="286">head down: just a maze.</text>
  <text class="hand lbl-sm" x="292" y="306">head up: a message.</text>
</svg>
