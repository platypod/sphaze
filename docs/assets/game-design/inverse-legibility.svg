<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="A cross-section of a corridor floor with walls that grow taller from left to right toward a goal. A sightline from the left passes over the short walls but is blocked by the tall ones near the goal.">
  <title>Inverse-legibility walls</title>
  <style>
    .paper { fill: #f6efe0; }
    .ink { fill: none; stroke: #3b3226; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .ink-thin { fill: none; stroke: #3b3226; stroke-width: 1.3; stroke-linecap: round; }
    .ink-dash { fill: none; stroke: #7a6c58; stroke-width: 1.5; stroke-dasharray: 7 6; stroke-linecap: round; }
    .wall { fill: #d8cbb0; stroke: #3b3226; stroke-width: 1.8; stroke-linejoin: round; }
    .accent { fill: none; stroke: #c9762a; stroke-width: 2.6; stroke-linecap: round; }
    .accent-fill { fill: #c9762a; }
    .pink { fill: #d1477f; stroke: #3b3226; stroke-width: 1.4; }
    .shade { fill: #3b3226; opacity: 0.13; }
    .hand { font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", "Chalkboard SE", cursive; fill: #3b3226; }
    .ttl { font-size: 20px; }
    .lbl { font-size: 14px; }
    .lbl-sm { font-size: 12.5px; fill: #7a6c58; }
  </style>

  <rect class="paper" width="720" height="380" rx="10"/>
  <text class="hand ttl" x="26" y="36">inverse-legibility walls</text>
  <text class="hand lbl-sm" x="26" y="56">the closer you get, the less you can see: the plan has to be made from afar</text>

  <!-- ground -->
  <path class="ink" d="M 40 300 C 240 288 480 288 690 300"/>

  <!-- walls growing toward the goal -->
  <rect class="wall" x="120" y="272" width="15" height="24" rx="2"/>
  <rect class="wall" x="215" y="258" width="15" height="36" rx="2"/>
  <rect class="wall" x="310" y="238" width="15" height="55" rx="2"/>
  <rect class="wall" x="405" y="210" width="15" height="82" rx="2"/>
  <rect class="wall" x="500" y="176" width="15" height="115" rx="2"/>
  <rect class="wall" x="595" y="140" width="15" height="152" rx="2"/>

  <!-- the surveyor, far out -->
  <circle class="ink" cx="70" cy="272" r="8"/>
  <path class="ink" d="M 70 280 L 70 294 M 70 285 L 61 291 M 70 285 L 79 291"/>

  <!-- sightline: clears the low walls, dies against the tall ones -->
  <path class="ink-dash" d="M 78 266 L 400 206"/>
  <path class="accent" d="M 404 200 L 424 214 M 424 200 L 404 214"/>

  <!-- goal -->
  <path class="ink" d="M 652 292 L 652 196"/>
  <path class="wall" d="M 652 196 L 690 208 L 652 220 Z"/>

  <text class="hand lbl" x="60" y="332">survey from here…</text>
  <text class="hand lbl" x="330" y="332">…sightline dies here</text>
  <text class="hand lbl" x="590" y="332">goal</text>
  <text class="hand lbl-sm" x="120" y="360">wall height is the design variable — tallest where it matters most</text>
</svg>
